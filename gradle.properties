# Gradle / Kotlin 构建配置（项目级）
#
# Kotlin 编译守护进程默认堆不足以编译 miuix 0.9.4 + Compose 这套栈，
# :app:compileDebugKotlin 会抛 "OutOfMemoryError: GC overhead limit exceeded"。这里显式加大。

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

kotlin.daemon.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

org.gradle.caching=true

# Compose / activity-compose 属于 AndroidX 构件，缺这个开关 Gradle 会拒绝解析
android.useAndroidX=true

# 本模块源码全部 UTF-8（含中文注释与字符串资源）
android.enableJetifier=false

# 单模块工程，开启配置缓存会与 libxposed 的 AAR 变体解析冲突，保持关闭
org.gradle.configuration-cache=false
