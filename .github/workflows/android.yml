name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 组装 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # compileSdk 37 与 AGP 9.2.1 都要求 JDK 17 以上，本机用的也是 21。
      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 37 对应的是带次版本号的平台包 platforms;android-37.0，
      # 预装镜像里没有它，必须显式安装，否则 AGP 会报 “SDK platform 37 not found”。
      - name: 安装 SDK 平台与构建工具
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          sdkmanager --list_installed | grep -E "android-37|build-tools;37"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # release 构建沿用 debug 签名（见 app/build.gradle.kts），
      # 所以 CI 不需要任何密钥；这里只是把可能的缺失提前补上。
      - name: 准备 debug 签名
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 组装 Release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperExtend-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布到 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: HyperExtend-release-apk
          path: dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes
