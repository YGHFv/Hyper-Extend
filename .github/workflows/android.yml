name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 组装 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # compileSdk 37 与 AGP 9.2.1 都要求 JDK 17 以上，本机用的也是 21。
      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu 运行器已预装 Android SDK 与已接受的许可证，这里直接复用，
      # 不引入 android-actions/setup-android（它需要写 runner 的 SDK 目录，易失败）。
      #
      # compileSdk 37 对应的是带次版本号的平台包 platforms;android-37.0，
      # 预装镜像里没有它，必须显式安装，否则 AGP 会报 “SDK platform 37 not found”。
      - name: 安装 SDK 平台与构建工具
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK_ROOT"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"
          fi
          echo "sdkmanager: $SDKMANAGER"

          # 运行器镜像已经接受过 SDK 许可证，正常不需要交互确认。
          # 这里刻意关掉 pipefail：确认输入用完后 yes 会收到 SIGPIPE，
          # 开着 pipefail 会把这条管道判成失败，让整步误报（首次运行的实际原因）。
          # 真正的判据是下面那条 list_installed + grep。
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" || true
          set -o pipefail

          "$SDKMANAGER" --list_installed | grep -E "android-37|build-tools;37"

          # 没有 local.properties（被 .gitignore 排除），AGP 只能靠环境变量定位 SDK。
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # release 构建沿用 debug 签名（见 app/build.gradle.kts），
      # 所以 CI 不需要任何密钥；这里只是把可能的缺失提前补上。
      - name: 准备 debug 签名
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 版本号的唯一来源是 app/build.gradle.kts，发版任务据此决定要不要建标签。
      - name: 读取版本号
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ *versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          CODE="$(sed -n 's/^ *versionCode *= *\([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "本次构建：versionName=$VERSION versionCode=$CODE"

      - name: 测试并组装 Release
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperExtend-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # 推送 main：只有 app/build.gradle.kts 里的 versionName 变了（对应标签还不存在）才发版，
  # 版本号没动时只留构建工件，不会重复建 Release。
  auto-release:
    name: 自动打标签发版
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: HyperExtend-release-apk
          path: dist

      - name: 建标签并发版
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过发版。"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            gh release create "$TAG" dist/*.apk --title "$TAG" --generate-notes
          else
            gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

  # 手动推版本标签时也发版，两条路都走同一份构建产物。
  release:
    name: 发布标签对应的 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: HyperExtend-release-apk
          path: dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，改为覆盖上传产物。"
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes
          fi
